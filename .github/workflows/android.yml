name: Android verification

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/data/exercise-catalog.json"
      - "src/js/catalog/**"
      - "src/js/domain/schedule.js"
      - "src/js/domain/workout-metrics.js"
      - "src/js/domain/training-rules.js"
      - "src/js/core/constants.js"
      - "tests/fixtures/android/**"
      - "tests/unit/android-contract.test.js"
      - "scripts/verify-android-roundtrip.mjs"
      - "scripts/verify-android-training.mjs"
      - "scripts/verify-android-lifecycle.mjs"
      - "scripts/verify-android-routines.mjs"
      - "scripts/generate-android-starters.mjs"
      - "scripts/verify-android-starters.mjs"
      - "scripts/verify-android-schedule.mjs"
      - "scripts/verify-android-history.mjs"
      - "scripts/verify-android-preferences.mjs"
      - "scripts/generate-android-progress.mjs"
      - "scripts/generate-android-training-rules.mjs"
      - "scripts/verify-android-progression.mjs"
      - "scripts/generate-android-backup-status.mjs"
      - "scripts/verify-android-guidance.mjs"
      - "scripts/generate-android-history-filters.mjs"
      - "scripts/generate-android-insights.mjs"
      - "scripts/generate-android-data-actions.mjs"
      - "scripts/verify-android-data-actions.mjs"
      - "src/js/application/backup.js"
      - ".github/workflows/android.yml"
  push:
    branches: [main, "android/**"]
    paths:
      - "android/**"
      - "src/data/exercise-catalog.json"
      - "src/js/catalog/**"
      - "src/js/domain/schedule.js"
      - "src/js/domain/workout-metrics.js"
      - "src/js/domain/training-rules.js"
      - "src/js/core/constants.js"
      - "tests/fixtures/android/**"
      - "tests/unit/android-contract.test.js"
      - "scripts/verify-android-roundtrip.mjs"
      - "scripts/verify-android-training.mjs"
      - "scripts/verify-android-lifecycle.mjs"
      - "scripts/verify-android-routines.mjs"
      - "scripts/generate-android-starters.mjs"
      - "scripts/verify-android-starters.mjs"
      - "scripts/verify-android-schedule.mjs"
      - "scripts/verify-android-history.mjs"
      - "scripts/verify-android-preferences.mjs"
      - "scripts/generate-android-progress.mjs"
      - "scripts/generate-android-training-rules.mjs"
      - "scripts/verify-android-progression.mjs"
      - "scripts/generate-android-backup-status.mjs"
      - "scripts/verify-android-guidance.mjs"
      - "scripts/generate-android-history-filters.mjs"
      - "scripts/generate-android-insights.mjs"
      - "scripts/generate-android-data-actions.mjs"
      - "scripts/verify-android-data-actions.mjs"
      - "src/js/application/backup.js"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned fixture-verification tools
        working-directory: .
        run: npm ci --ignore-scripts
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore optional preview signing identity
        env:
          PREVIEW_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$PREVIEW_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Build, test persistence and lint
        run: |
          node ../scripts/generate-android-starters.mjs --check
          node ../scripts/generate-android-progress.mjs --check
          node ../scripts/generate-android-training-rules.mjs --check
          node ../scripts/generate-android-backup-status.mjs --check
          node ../scripts/generate-android-history-filters.mjs --check
          node ../scripts/generate-android-insights.mjs --check
          node ../scripts/generate-android-data-actions.mjs --check
          ./gradlew --no-daemon checkKotlinFormat :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Build the pinned version-2 upgrade baseline
        run: bash qa/build_upgrade_baseline.sh
      - name: Verify native export with the PWA importer
        run: |
          node ../scripts/verify-android-roundtrip.mjs app/build/outputs/compatibility/native-export.json
          node ../scripts/verify-android-training.mjs app/build/outputs/compatibility/training-export.json
          node ../scripts/verify-android-routines.mjs app/build/outputs/compatibility/routine-export.json
          node ../scripts/verify-android-starters.mjs app/build/outputs/compatibility/starter-export.json
          node ../scripts/verify-android-schedule.mjs app/build/outputs/compatibility/schedule-export.json
          node ../scripts/verify-android-history.mjs app/build/outputs/compatibility/history-export.json
          node ../scripts/verify-android-preferences.mjs app/build/outputs/compatibility/preferences-export.json
          node ../scripts/verify-android-progression.mjs app/build/outputs/compatibility/progression-export.json
          node ../scripts/verify-android-guidance.mjs app/build/outputs/compatibility/guidance-export.json
          node ../scripts/verify-android-data-actions.mjs reset app/build/outputs/compatibility/settings-reset-export.json
          node ../scripts/verify-android-data-actions.mjs clear app/build/outputs/compatibility/data-cleared-export.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native workout flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: >-
            bash -c '
            python3 qa/verify_lifecycle.py --serial emulator-5554 --baseline-dir "$RUNNER_TEMP/workout-upgrade-baseline/android" || exit $?;
            node ../scripts/verify-android-lifecycle.mjs app/build/outputs/lifecycle/database/lifecycle-export.json || exit $?;
            ./gradlew --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest;
            native_status=$?;
            adb pull /sdcard/Android/data/com.hector.workouttracker/files/qa app/build/outputs/screenshots;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-routines.mjs app/build/outputs/screenshots/routine-editor-export.json --device || exit $?; fi;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-starters.mjs app/build/outputs/screenshots/starter-export.json || exit $?; fi;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-schedule.mjs app/build/outputs/screenshots/schedule-export.json --device || exit $?; fi;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-history.mjs app/build/outputs/screenshots/history-export.json --device || exit $?; fi;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-preferences.mjs app/build/outputs/screenshots/preferences-export.json --device || exit $?; fi;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-progression.mjs app/build/outputs/screenshots/progression-export.json --device || exit $?; fi;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-guidance.mjs app/build/outputs/screenshots/guidance-export.json --device || exit $?; fi;
            if [ "$native_status" -eq 0 ]; then node ../scripts/verify-android-data-actions.mjs reset app/build/outputs/screenshots/settings-reset-export.json --device || exit $?; fi;
            exit "$native_status"
            '
      - name: Build and sign the release preview
        if: github.event_name == 'push'
        env:
          RELEASE_KEY: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY" && test -n "$RELEASE_STORE_PASSWORD" && test -n "$RELEASE_KEY_PASSWORD" && test -n "$RELEASE_KEY_ALIAS"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/workout-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$RELEASE_KEY" | base64 --decode > "$signing_dir/release.p12"
          ./gradlew --no-daemon :app:assembleRelease
          destination=app/build/outputs/signed-preview
          mkdir -p "$destination"
          apk="$destination/WorkoutTracker-0.17.0-preview.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$signing_dir/release.p12" --ks-key-alias "$RELEASE_KEY_ALIAS" --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$destination/SIGNATURE.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $(cat qa/release-certificate.sha256)" "$destination/SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > "$destination/MANIFEST.txt"
          grep -F "versionCode='17' versionName='0.17.0-preview'" "$destination/MANIFEST.txt"
          ! grep -q '^application-debuggable' "$destination/MANIFEST.txt"
          (cd "$destination" && sha256sum WorkoutTracker-0.17.0-preview.apk > SHA256SUMS)
          printf 'commit=%s\nrun=https://github.com/%s/actions/runs/%s\nversionCode=17\nversionName=0.17.0-preview\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$destination/PROVENANCE.txt"
      - name: Upload signed release preview
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-android-release-preview
          path: android/app/build/outputs/signed-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-android-verification
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/outputs/compatibility/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/screenshots/
            android/app/build/outputs/lifecycle/
          if-no-files-found: warn
          retention-days: 14
