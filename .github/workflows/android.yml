name: Android foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "tests/fixtures/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main, "android/**"]
    paths:
      - "android/**"
      - "tests/fixtures/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore optional preview signing identity
        env:
          PREVIEW_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$PREVIEW_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Build, test persistence and lint
        run: ./gradlew --no-daemon checkKotlinFormat :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native workout flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload preview APK and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-android-foundation
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
